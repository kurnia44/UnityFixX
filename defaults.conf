# UnityFix X — default config
# mask bisa angka desimal (bit0=cpu0) ATAU symbol:
#   auto   = deteksi topologi otomatis (default)
#            ada cluster kecil (<=65% freq max, >=2 core) → cluster itu dibuang
#            tidak ada cluster kecil (mis. SD 8 Elite 6+2) → pakai semua core
#   all    = semua core | big = semua kecuali cluster kecil
#   prime  = cluster freq tertinggi | top4 / top2 = 4 / 2 core tercepat
#   255 = all cores | 240 = cpu4-7 | 192 = cpu6-7 | 15 = cpu0-3
